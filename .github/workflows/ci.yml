name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    env:
      PYTHONIOENCODING: cp1252  # mimic a legacy Windows console everywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb > /dev/null
          xvfb-run -a python -m unittest discover -s tests -v
      - name: Tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
      - name: CLI help
        run: |
          python manga2xtc.py --help
          python manhwa2xtc.py --help
